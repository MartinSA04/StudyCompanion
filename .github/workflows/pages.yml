name: Deploy hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "src/styles/**"
      - "src/components/ThemeToggle.astro"
      - "src/components/Icon.astro"
      - "src/lib/favicon.ts"
      - "src/lib/pageLifecycle.ts"
      - "astro.config.hub.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restored now that a release is one self-consistent commit. This gate was
      # removed because release.test.ts checked the course-template lockfile
      # against its pin and was red on the release commit by design: it failed the
      # deploy, and then did NOT re-run on the follow-up lockfile-sync commit
      # (outside this workflow's path filter), stranding the hub un-deployed.
      # There is no sync commit any more, so no ref is red by construction.
      - run: pnpm test
      - run: pnpm hub:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-hub/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
